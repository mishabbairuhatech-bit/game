# =============================================================================
# EMPIRE FRONTIER - production stack
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev stack:
#   * multi-stage "production" build targets, optimised images
#   * NO source bind mounts (code is baked into the image)
#   * every app container runs as a non-root user
#   * postgres / redis are internal only, no published host ports
#   * nginx is the single ingress
#   * restart: always + healthchecks + resource limits
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-empire-frontier}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    container_name: empire_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [empire_network]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }

  redis:
    image: redis:7-alpine
    container_name: empire_redis
    restart: always
    # The healthcheck shell runs inside the container, so it needs the password
    # in its own environment - it cannot see the compose-level substitution.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [empire_network]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1500M }

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: empire-frontier/api:${IMAGE_TAG:-latest}
    restart: always
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_PRETTY: "false"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    user: "node"
    read_only: false
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # curl, not `node -e`: spawning a Node runtime every 15s costs ~60ms of
      # CPU and a fresh V8 heap, which is enough to time out - and mark a
      # perfectly healthy container unhealthy - when the host is busy. The
      # probe must be cheaper than the thing it is measuring.
      test: ["CMD", "curl", "-fsS", "-m", "4", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose: ["4000"]
    networks: [empire_network]
    logging: *default-logging
    deploy:
      # Stateless API: safe to scale once the Socket.IO Redis adapter is on.
      replicas: ${API_REPLICAS:-1}
      resources:
        limits: { cpus: "2.0", memory: 2G }

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    image: empire-frontier/web:${IMAGE_TAG:-latest}
    restart: always
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose: ["8080"]
    networks: [empire_network]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /admin/
    image: empire-frontier/admin:${IMAGE_TAG:-latest}
    restart: always
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose: ["8080"]
    networks: [empire_network]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  nginx:
    image: nginx:1.27-alpine
    container_name: empire_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./assets:/srv/assets:ro
    depends_on:
      frontend: { condition: service_healthy }
      admin: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    networks: [empire_network]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

networks:
  empire_network:
    name: empire_network
    driver: bridge

volumes:
  postgres_data:
    name: empire_postgres_data
  redis_data:
    name: empire_redis_data
