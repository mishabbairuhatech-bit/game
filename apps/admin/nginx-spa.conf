# SPA server for the production admin image.
# The bundle is built with base=/admin/ and served from
# /usr/share/nginx/html/admin, so incoming /admin/... paths map straight through.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The panel must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/admin/.*\.(js|css|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/admin/.*\.(png|jpe?g|svg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Deep links like /admin/config are client-side routes.
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # Anything outside /admin does not belong to this container.
    location / {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
