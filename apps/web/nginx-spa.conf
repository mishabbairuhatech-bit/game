# SPA server for the production game-client image.
# Runs as nginx-unprivileged on :8080 behind the edge NGINX.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location ~* \.(js|css|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3D models and audio: large, hashed by the bundler or versioned by path.
    location ~* \.(glb|gltf|bin|ktx2|basis|mp3|ogg|wav|webp|avif|png|jpe?g|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy would leave clients loading
    # a stale document that references deleted chunk filenames.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf+json;
    gzip_min_length 1024;
}
