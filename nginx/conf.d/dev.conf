# -----------------------------------------------------------------------------
# Empire Frontier - DEVELOPMENT reverse proxy
#   /            -> frontend (Vite dev server, HMR over websocket)
#   /api/        -> backend  (NestJS)
#   /socket.io/  -> backend  (Socket.IO websocket)
#   /admin/      -> admin    (Vite dev server, base=/admin/)
#   /assets/     -> static 3D/audio assets from the repo
# -----------------------------------------------------------------------------

upstream empire_frontend { server frontend:5173; keepalive 32; }
upstream empire_backend  { server backend:4000;  keepalive 64; }
upstream empire_admin    { server admin:5174;    keepalive 32; }

server {
    listen 80 default_server;
    server_name _;

    # --- security headers (relaxed CSP so the Vite dev server works) --------
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection           "0"                 always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(self)" always;
    add_header X-Request-Id               $request_id         always;

    limit_conn conn_zone 100;

    # --- nginx's own liveness probe ----------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- root-level aliases onto the API's probes ---------------------------
    # The canonical endpoints are /api/health and /api/ready (that is what the
    # container healthcheck hits directly on :4000). These aliases exist for
    # ops tooling and uptime monitors that expect root-level probes.
    location = /health { proxy_pass http://empire_backend/api/health; access_log off; }
    location = /ready  { proxy_pass http://empire_backend/api/ready;  access_log off; }

    # --- auth endpoints get a much tighter budget ---------------------------
    location ~ ^/api/v[0-9]+/auth/(login|register|password/forgot|password/reset|verify/resend) {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://empire_backend;
        proxy_read_timeout 30s;
    }

    # --- REST API -----------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://empire_backend;
        proxy_read_timeout   60s;
        proxy_send_timeout   60s;
        proxy_buffering      off;
    }

    # --- Socket.IO / realtime ----------------------------------------------
    location /socket.io/ {
        proxy_pass http://empire_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering     off;
        access_log off;
    }

    # --- OpenAPI docs -------------------------------------------------------
    location /docs      { proxy_pass http://empire_backend/docs; }
    location /docs-json { proxy_pass http://empire_backend/docs-json; }

    # --- admin SPA (Vite dev server served under /admin/) -------------------
    location /admin {
        limit_req zone=admin_zone burst=40 nodelay;
        proxy_pass http://empire_admin;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # --- shared 3D / audio assets ------------------------------------------
    location /assets/ {
        alias /srv/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # --- game client (Vite dev server + HMR websocket) ----------------------
    location / {
        proxy_pass http://empire_frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
