# -----------------------------------------------------------------------------
# Empire Frontier - PRODUCTION reverse proxy
# The frontend/admin images serve prebuilt static bundles from their own nginx
# on :8080, so this layer only routes, caches and rate-limits.
#
# TLS: drop fullchain.pem / privkey.pem into ./nginx/certs and uncomment the
# 443 server block plus the redirect in the :80 block.
# -----------------------------------------------------------------------------

upstream empire_frontend { server frontend:8080; keepalive 32; }
upstream empire_backend  { server backend:4000;  keepalive 64; }
upstream empire_admin    { server admin:8080;    keepalive 32; }

server {
    listen 80 default_server;
    server_name _;

    # Uncomment once certificates are installed:
    # location / { return 301 https://$host$request_uri; }

    include /etc/nginx/includes/empire-routes.inc;
}

