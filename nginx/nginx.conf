user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 3D model types are not in nginx's bundled mime.types. `wasm` already is,
    # so re-declaring it only produces a startup warning.
    types {
        model/gltf-binary  glb;
        model/gltf+json    gltf;
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,'
      '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
      '"referrer":"$http_referer","agent":"$http_user_agent",'
      '"request_id":"$request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;
    client_max_body_size 25m;
    client_body_timeout 30s;
    reset_timedout_connection on;

    # ---- gzip -------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/wasm
        image/svg+xml model/gltf+json;

    # ---- websocket upgrade map --------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- rate limit zones --------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_zone:16m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:8m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:8m  rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:16m;

    # Real client IP when running behind a cloud load balancer.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    include /etc/nginx/conf.d/*.conf;
}
