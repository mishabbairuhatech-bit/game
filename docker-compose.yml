# =============================================================================
# EMPIRE FRONTIER - development stack
#   docker compose up -d --build
#   open http://localhost
# Only nginx publishes a host port. Everything else talks over empire_network
# using docker service names (postgres, redis, backend, frontend, admin).
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-empire-frontier}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- postgres --
  postgres:
    image: postgres:17-alpine
    container_name: empire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empire}
      POSTGRES_DB: ${POSTGRES_DB:-empire_frontier}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empire} -d ${POSTGRES_DB:-empire_frontier} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [empire_network]
    logging: *default-logging
    # Dev-only convenience so you can attach a local SQL client. Bound to
    # loopback and offset from 5432 so it never fights a PostgreSQL install on
    # the host. Not published at all in docker-compose.prod.yml.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  # ------------------------------------------------------------------- redis --
  redis:
    image: redis:7-alpine
    container_name: empire_redis
    restart: unless-stopped
    # The healthcheck shell runs inside the container, so it needs the password
    # in its own environment - it cannot see the compose-level substitution.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-empire}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-empire}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-empire}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [empire_network]
    logging: *default-logging
    # Same rationale as postgres above: offset from 6379 to avoid a clash with
    # a Redis install on the host.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  # ----------------------------------------------------------------- backend --
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: empire_backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Hot reload: bind the source in, keep the container's hoisted
      # node_modules (npm workspaces put everything in the root one).
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/test:/app/apps/api/test
      - ./packages:/app/packages
      - api_node_modules:/app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # curl, not `node -e`: spawning a Node runtime every 15s costs ~60ms of
      # CPU and a fresh V8 heap, which is enough to time out - and mark a
      # perfectly healthy container unhealthy - when the host is busy. The
      # probe must be cheaper than the thing it is measuring.
      test: ["CMD", "curl", "-fsS", "-m", "4", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    expose: ["4000"]
    networks: [empire_network]
    logging: *default-logging

  # ---------------------------------------------------------------- frontend --
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: empire_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: /api
      VITE_SOCKET_URL: /
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages:/app/packages
      - ./assets:/app/apps/web/public/assets:ro
      - web_node_modules:/app/node_modules
    depends_on:
      backend: { condition: service_started }
    healthcheck:
      # busybox wget, not `node -e`: a Node runtime per probe costs more CPU
      # than the request, and under load the probe becomes the reason the
      # container is reported unhealthy.
      test: ["CMD", "wget", "--spider", "-q", "-T", "4", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    expose: ["5173"]
    networks: [empire_network]
    logging: *default-logging

  # ------------------------------------------------------------------- admin --
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: development
    container_name: empire_admin
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: /api
      VITE_BASE_PATH: /admin/
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/index.html:/app/apps/admin/index.html
      - ./packages:/app/packages
      - admin_node_modules:/app/node_modules
    depends_on:
      backend: { condition: service_started }
    healthcheck:
      # busybox wget, not `node -e`: a Node runtime per probe costs more CPU
      # than the request, and under load the probe becomes the reason the
      # container is reported unhealthy.
      test: ["CMD", "wget", "--spider", "-q", "-T", "4", "http://127.0.0.1:5174/admin/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    expose: ["5174"]
    networks: [empire_network]
    logging: *default-logging

  # ------------------------------------------------------------------- nginx --
  nginx:
    image: nginx:1.27-alpine
    container_name: empire_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/srv/assets:ro
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
      admin: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [empire_network]
    logging: *default-logging

  # ---------------------------------- optional dev object storage (profile) ---
  # Enable with:  docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    container_name: empire_minio
    restart: unless-stopped
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-empire_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-empire_minio_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [empire_network]
    logging: *default-logging

networks:
  empire_network:
    name: empire_network
    driver: bridge

volumes:
  postgres_data:
    name: empire_postgres_data
  redis_data:
    name: empire_redis_data
  minio_data:
    name: empire_minio_data
  api_node_modules:
  web_node_modules:
  admin_node_modules:
